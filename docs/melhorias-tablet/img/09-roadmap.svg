<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-label="Roteiro em sete fases: Fase V (agente abre arquivos) e Fase A (aba Artefatos) primeiro, no layout atual; depois fundações, navegador de arquivos, chat para claude, layout v3 e codex com extras">
  <style>
    text{font-family:Figtree,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#3b3530}
    .h{font-size:13px;font-weight:700}
    .s{font-size:11px;fill:#4b453e}
    .d{font-size:11px;fill:#8a8378}
    .t{font-size:15px;font-weight:700}
  </style>
  <rect width="1000" height="490" rx="14" fill="#f7f5f0"/>
  <text x="24" y="34" class="t">Ordem sugerida de entrega (cada fase gera um PR que funciona sozinho)</text>
  <line x1="180" y1="60" x2="976" y2="60" stroke="#c9c3b7"/>
  <g class="d">
    <text x="180" y="54">semana 1</text><text x="339" y="54">semana 2</text><text x="498" y="54">semana 3</text><text x="657" y="54">semana 4</text><text x="816" y="54">semana 5</text>
  </g>
  <g stroke="#e2ddd3"><line x1="339" y1="60" x2="339" y2="420"/><line x1="498" y1="60" x2="498" y2="420"/><line x1="657" y1="60" x2="657" y2="420"/><line x1="816" y1="60" x2="816" y2="420"/></g>

  <text x="24" y="98" class="h">FV Agente abre arquivo</text>
  <rect x="180" y="80" width="150" height="34" rx="8" fill="#2f7564"/>
  <text x="190" y="102" class="s" style="fill:#ffffff">tool · dropdown · tela cheia</text>

  <text x="24" y="148" class="h">FA Artefatos</text>
  <rect x="300" y="130" width="130" height="34" rx="8" fill="#3f8f7c"/>
  <text x="310" y="152" class="s" style="fill:#ffffff">aba · cliente/projeto</text>

  <text x="24" y="198" class="h">F0 Fundações</text>
  <rect x="430" y="180" width="120" height="34" rx="8" fill="#d8d3c8"/>
  <text x="440" y="202" class="s">auth · routers</text>

  <text x="24" y="248" class="h">F1 Navegador</text>
  <rect x="550" y="230" width="170" height="34" rx="8" fill="#9fd0c1"/>
  <text x="560" y="252" class="s">árvore · busca · diff · zip</text>

  <text x="24" y="298" class="h">F2 Chat claude</text>
  <rect x="550" y="280" width="320" height="34" rx="8" fill="#5b9c8a"/>
  <text x="560" y="302" class="s" style="fill:#ffffff">ws/chat + adapter + ChatView + aprovações</text>

  <text x="24" y="348" class="h">F3 Layout v3</text>
  <rect x="740" y="330" width="170" height="34" rx="8" fill="#b9c3ea"/>
  <text x="750" y="352" class="s">lista WhatsApp · 3 painéis</text>

  <text x="24" y="398" class="h">F4 Codex + extras</text>
  <rect x="820" y="380" width="156" height="34" rx="8" fill="#e5c77f"/>
  <text x="830" y="402" class="s">codex · busca · custos</text>

  <text x="24" y="450" class="d">Largura das barras = esforço relativo estimado para um agente com revisão humana, não prazo fechado.</text>
  <text x="24" y="468" class="d">FV e FA rodam no layout atual. F1 e F2 dependem de F0; F3 (mudança de layout) fica por último e aproveita tudo antes.</text>
</svg>
