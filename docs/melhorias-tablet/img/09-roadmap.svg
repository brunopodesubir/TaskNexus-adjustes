<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-label="Roteiro em cinco fases: fundações, visualizador de arquivos, chat para claude, layout v3 e codex com extras; as fases 1 e 2 podem correr em paralelo depois da fase 0">
  <style>
    text{font-family:Figtree,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#3b3530}
    .h{font-size:13px;font-weight:700}
    .s{font-size:11px;fill:#4b453e}
    .d{font-size:11px;fill:#8a8378}
    .t{font-size:15px;font-weight:700}
  </style>
  <rect width="1000" height="400" rx="14" fill="#f7f5f0"/>
  <text x="24" y="34" class="t">Ordem sugerida de entrega (cada fase gera um PR que funciona sozinho)</text>
  <!-- axis -->
  <line x1="150" y1="60" x2="976" y2="60" stroke="#c9c3b7"/>
  <g class="d">
    <text x="150" y="54">semana 1</text><text x="315" y="54">semana 2</text><text x="480" y="54">semana 3</text><text x="645" y="54">semana 4</text><text x="810" y="54">semana 5</text>
  </g>
  <g stroke="#e2ddd3"><line x1="315" y1="60" x2="315" y2="330"/><line x1="480" y1="60" x2="480" y2="330"/><line x1="645" y1="60" x2="645" y2="330"/><line x1="810" y1="60" x2="810" y2="330"/></g>

  <text x="24" y="98" class="h">F0 Fundações</text>
  <rect x="150" y="80" width="150" height="34" rx="8" fill="#d8d3c8"/>
  <text x="160" y="102" class="s">auth · routers · links xterm</text>

  <text x="24" y="148" class="h">F1 Arquivos</text>
  <rect x="300" y="130" width="250" height="34" rx="8" fill="#9fd0c1"/>
  <text x="310" y="152" class="s">API fs + FileViewer + download</text>

  <text x="24" y="198" class="h">F2 Chat claude</text>
  <rect x="300" y="180" width="420" height="34" rx="8" fill="#3f8f7c"/>
  <text x="310" y="202" class="s" style="fill:#ffffff">ws/chat + adapter + ChatView + aprovações + histórico</text>

  <text x="24" y="248" class="h">F3 Layout v3</text>
  <rect x="560" y="230" width="250" height="34" rx="8" fill="#b9c3ea"/>
  <text x="570" y="252" class="s">lista estilo WhatsApp · 3 painéis · tokens</text>

  <text x="24" y="298" class="h">F4 Codex + extras</text>
  <rect x="740" y="280" width="236" height="34" rx="8" fill="#e5c77f"/>
  <text x="750" y="302" class="s">codex app-server · diff · busca</text>

  <text x="24" y="360" class="d">Largura das barras = esforço relativo estimado para um agente com revisão humana, não prazo fechado.</text>
  <text x="24" y="378" class="d">F1 e F2 dependem só de F0; F3 aproveita os componentes de F1 e F2.</text>
</svg>
