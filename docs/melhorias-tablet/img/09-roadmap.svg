<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="Roteiro em seis fases: a Fase V (agente abre arquivos na tela) vem primeiro; depois fundações, navegador de arquivos, chat para claude, layout v3 e codex com extras">
  <style>
    text{font-family:Figtree,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#3b3530}
    .h{font-size:13px;font-weight:700}
    .s{font-size:11px;fill:#4b453e}
    .d{font-size:11px;fill:#8a8378}
    .t{font-size:15px;font-weight:700}
  </style>
  <rect width="1000" height="440" rx="14" fill="#f7f5f0"/>
  <text x="24" y="34" class="t">Ordem sugerida de entrega (cada fase gera um PR que funciona sozinho)</text>
  <line x1="170" y1="60" x2="976" y2="60" stroke="#c9c3b7"/>
  <g class="d">
    <text x="170" y="54">semana 1</text><text x="331" y="54">semana 2</text><text x="492" y="54">semana 3</text><text x="653" y="54">semana 4</text><text x="814" y="54">semana 5</text>
  </g>
  <g stroke="#e2ddd3"><line x1="331" y1="60" x2="331" y2="370"/><line x1="492" y1="60" x2="492" y2="370"/><line x1="653" y1="60" x2="653" y2="370"/><line x1="814" y1="60" x2="814" y2="370"/></g>

  <text x="24" y="98" class="h">FV Agente abre arquivo</text>
  <rect x="170" y="80" width="170" height="34" rx="8" fill="#2f7564"/>
  <text x="180" y="102" class="s" style="fill:#ffffff">tool MCP · dropdown · tela cheia</text>

  <text x="24" y="148" class="h">F0 Fundações</text>
  <rect x="330" y="130" width="140" height="34" rx="8" fill="#d8d3c8"/>
  <text x="340" y="152" class="s">auth · routers</text>

  <text x="24" y="198" class="h">F1 Navegador</text>
  <rect x="470" y="180" width="190" height="34" rx="8" fill="#9fd0c1"/>
  <text x="480" y="202" class="s">árvore · busca · diff · zip</text>

  <text x="24" y="248" class="h">F2 Chat claude</text>
  <rect x="470" y="230" width="360" height="34" rx="8" fill="#3f8f7c"/>
  <text x="480" y="252" class="s" style="fill:#ffffff">ws/chat + adapter + ChatView + aprovações</text>

  <text x="24" y="298" class="h">F3 Layout v3</text>
  <rect x="680" y="280" width="200" height="34" rx="8" fill="#b9c3ea"/>
  <text x="690" y="302" class="s">lista WhatsApp · 3 painéis</text>

  <text x="24" y="348" class="h">F4 Codex + extras</text>
  <rect x="800" y="330" width="176" height="34" rx="8" fill="#e5c77f"/>
  <text x="810" y="352" class="s">codex · busca · custos</text>

  <text x="24" y="400" class="d">Largura das barras = esforço relativo estimado para um agente com revisão humana, não prazo fechado.</text>
  <text x="24" y="418" class="d">FV não depende de nada. F1 e F2 dependem de F0; F3 aproveita os componentes de FV, F1 e F2.</text>
</svg>
